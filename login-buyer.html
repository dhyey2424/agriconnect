<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Wholesale Buyer Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <div class="text-center mb-6">
      <span class="bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wide">Procurement Portal</span>
      <h2 class="text-2xl font-bold text-gray-900 mt-2">AgriConnect Buyer Portal</h2>
      <p class="text-xs text-gray-500 mt-1">Source AI-graded certified bulk produce directly from farmers</p>
    </div>

    <form onsubmit="handleBuyerLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Corporate / Mandi GSTIN</label>
        <input type="text" required placeholder="27AAAAA0000A1Z5" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Business Name</label>
        <input type="text" required placeholder="Apex Agribusiness Pvt Ltd" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Passcode</label>
        <input type="password" required value="1234" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Access Marketplace & Bidding →
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-500">
      Are you a farmer? <a href="/login-farmer.html" class="text-blue-600 font-bold hover:underline">Login via Farmer Portal</a>
    </div>
  </div>

  <script>
    function handleBuyerLogin(e) {
      e.preventDefault();
      localStorage.setItem("userRole", "buyer");
      window.location.href = "/marketplace.html";
    }
  </script>
</body>
</html>
