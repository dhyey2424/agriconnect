<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect - Farmer Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <div class="text-center mb-6">
      <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wide">Farmer Access</span>
      <h2 class="text-2xl font-bold text-gray-900 mt-2">AgriConnect Farmer Portal</h2>
      <p class="text-xs text-gray-500 mt-1">Access direct buyer bidding, AI quality reports, and mandi prices</p>
    </div>

    <form onsubmit="handleFarmerLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Mobile Number / Farmer ID</label>
        <input type="text" required placeholder="+91 98765 43210" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Select Primary Crop</label>
        <select class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm outline-none bg-white">
          <option>Onion / Pyaz</option>
          <option>Tomato</option>
          <option>Potato / Aloo</option>
          <option>Cotton / Kapas</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Passcode / OTP</label>
        <input type="password" required value="1234" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm outline-none">
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        Login to Farmer Dashboard →
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-500">
      Need buyer procurement access? <a href="/login-buyer.html" class="text-emerald-600 font-bold hover:underline">Switch to Buyer Login</a>
    </div>
  </div>

  <script>
    function handleFarmerLogin(e) {
      e.preventDefault();
      localStorage.setItem("userRole", "farmer");
      window.location.href = "/farmer.html";
    }
  </script>
</body>
</html>
